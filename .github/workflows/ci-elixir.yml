name: CI — Elixir

on:
  push:
    branches: [main]
    paths:
      - "elixir/**"
  pull_request:
    paths:
      - "elixir/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-elixir-${{ matrix.elixir-version }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # mix.exs requires elixir "~> 1.15".
        include:
          - elixir-version: "1.15"
            otp-version: "26.2"
          - elixir-version: "1.16"
            otp-version: "26.2"
          - elixir-version: "1.17"
            otp-version: "27.3"
          - elixir-version: "1.20"
            otp-version: "29"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir ${{ matrix.elixir-version }} / OTP ${{ matrix.otp-version }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}

      - name: Install dependencies
        run: mix deps.get
        working-directory: elixir

      - name: Run tests with coverage
        run: mix coveralls.json
        working-directory: elixir
        env:
          MIX_ENV: test

      - name: Format check
        run: mix format --check-formatted
        working-directory: elixir

      - name: Lint (credo)
        run: mix credo --strict
        working-directory: elixir

      - name: Dialyzer
        run: mix dialyzer
        working-directory: elixir

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: elixir/cover/excoveralls.json
          flags: elixir
          fail_ci_if_error: false

  # A path dependency doesn't pull the package's test-only deps, so this catches a
  # runtime application list that only works inside this repo (see 0.10.0 on Hex).
  consumer-smoke:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27.3"

      - name: Start kyccentral from a fresh consumer app
        working-directory: ${{ runner.temp }}
        run: |
          mix new consumer
          cd consumer
          cat > mix.exs <<EOF
          defmodule Consumer.MixProject do
            use Mix.Project

            def project do
              [app: :consumer, version: "0.1.0", elixir: "~> 1.15", deps: [{:kyccentral, path: "${GITHUB_WORKSPACE}/elixir"}]]
            end

            def application, do: [extra_applications: [:logger]]
          end
          EOF
          mix deps.get
          mix run -e 'case Application.ensure_all_started(:kyccentral) do
            {:ok, apps} -> IO.inspect({:ok, apps})
            other -> IO.inspect(other); System.halt(1)
          end'
