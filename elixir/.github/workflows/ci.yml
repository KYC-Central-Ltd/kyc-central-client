name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test — Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.15", otp: "25" }
          - { elixir: "1.16", otp: "26" }
          - { elixir: "1.17", otp: "27" }
          - { elixir: "1.18", otp: "27" }
          - { elixir: "1.20", otp: "29" }
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # The suite injects a stub HTTP function, so it needs no API key and no network.
      - run: mix test

  quality:
    name: Format, Credo and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-quality-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Docs
        run: mix docs

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # The PLT is expensive to build and changes only when deps or OTP change.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      - run: mix dialyzer --format short

  # A path dependency doesn't pull the package's test-only deps, so this catches a
  # runtime application list that only works inside this repo (see 0.10.0 on Hex).
  consumer-smoke:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Start kyccentral from a fresh consumer app
        run: |
          cd "$RUNNER_TEMP"
          mix new consumer
          cd consumer
          cat > mix.exs <<EOF
          defmodule Consumer.MixProject do
            use Mix.Project

            def project do
              [app: :consumer, version: "0.1.0", elixir: "~> 1.15", deps: [{:kyccentral, path: "${GITHUB_WORKSPACE}"}]]
            end

            def application, do: [extra_applications: [:logger]]
          end
          EOF
          mix deps.get
          mix run -e 'case Application.ensure_all_started(:kyccentral) do
            {:ok, apps} -> IO.inspect({:ok, apps})
            other -> IO.inspect(other); System.halt(1)
          end'
